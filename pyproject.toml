[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-powerbi-pipeline"
version = "0.5.0"
description = "Formula 1 data pipeline for a SQLite-backed Power BI dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "PyYAML>=6.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pandas-stubs>=2.0.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "streamlit>=1.30.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]

[project.scripts]
f1-pipeline = "main:main"

[tool.setuptools]
packages = ["config", "src"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = [
    "tests/",
]
